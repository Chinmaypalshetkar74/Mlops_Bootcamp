stages:
  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - data/raw/data.csv
    params:
      - preprocess.input
      - preprocess.output
    outs:
      - data/Preprocess/processed_data.csv

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/Preprocess/processed_data.csv
    params:
      - train.data
      - train.model_output
      - train.random_state
      - train.n_estimators
      - train.max_depth
    outs:
      - models/model.pkl
